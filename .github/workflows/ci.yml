name: CI — Test & Quality Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Quality — skips if no project yet
  # ─────────────────────────────────────────
  quality:
    name: Type check + Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check if Next.js project exists
        id: check
        run: |
          if [ -f "package.json" ]; then
            echo "has_project=true" >> $GITHUB_OUTPUT
          else
            echo "has_project=false" >> $GITHUB_OUTPUT
            echo "No package.json yet — skipping code checks (pre-Sprint 0)"
          fi

      - name: Set up Node ${{ env.NODE_VERSION }}
        if: steps.check.outputs.has_project == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.has_project == 'true'
        run: npm ci

      - name: TypeScript check
        if: steps.check.outputs.has_project == 'true'
        run: npm run type-check

      - name: ESLint
        if: steps.check.outputs.has_project == 'true'
        run: npm run lint

      - name: Tests
        if: steps.check.outputs.has_project == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.check.outputs.has_project == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ─────────────────────────────────────────
  # JOB 2: Jira comment on success
  # ─────────────────────────────────────────
  notify-jira-success:
    name: Comment on Jira ticket
    needs: quality
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Extract ticket ID
        id: extract
        run: |
          TICKET=$(echo "${{ github.event.head_commit.message }}" | grep -oE 'KAN-[0-9]+' | head -1)
          if [ -z "$TICKET" ]; then
            TICKET=$(echo "${{ github.head_ref || github.ref_name }}" | grep -oE 'KAN-[0-9]+' | head -1)
          fi
          echo "ticket=$TICKET" >> $GITHUB_OUTPUT

      - name: Post success comment to Jira
        if: steps.extract.outputs.ticket != ''
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN_B64 }}
        run: |
          SHA="${{ github.sha }}"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            "https://siddhantdave93.atlassian.net/rest/api/3/issue/${{ steps.extract.outputs.ticket }}/comment" \
            -H "Authorization: Basic $JIRA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\":{\"type\":\"doc\",\"version\":1,\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"✅ CI passed — ${SHA:0:7}: ${{ github.event.head_commit.message }} | $RUN\"}]}]}}"

  # ─────────────────────────────────────────
  # JOB 3: Jira + Telegram on failure
  # ─────────────────────────────────────────
  notify-jira-failure:
    name: Flag failure in Jira + Telegram
    needs: quality
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Extract ticket ID
        id: extract
        run: |
          TICKET=$(echo "${{ github.event.head_commit.message }}" | grep -oE 'KAN-[0-9]+' | head -1)
          if [ -z "$TICKET" ]; then
            TICKET=$(echo "${{ github.head_ref || github.ref_name }}" | grep -oE 'KAN-[0-9]+' | head -1)
          fi
          echo "ticket=$TICKET" >> $GITHUB_OUTPUT

      - name: Post failure comment to Jira
        if: steps.extract.outputs.ticket != ''
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN_B64 }}
        run: |
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            "https://siddhantdave93.atlassian.net/rest/api/3/issue/${{ steps.extract.outputs.ticket }}/comment" \
            -H "Authorization: Basic $JIRA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\":{\"type\":\"doc\",\"version\":1,\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"❌ CI FAILED — fix before merging: $RUN\",\"marks\":[{\"type\":\"strong\"}]}]}]}}"

      - name: Telegram alert
        run: |
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.SID_TELEGRAM_ID }}" \
            -d "text=❌ CI failed on ${{ github.ref_name }}%0A$RUN"
